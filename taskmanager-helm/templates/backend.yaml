apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmanager-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: taskmanager-backend
  template:
    metadata:
      labels:
        app: taskmanager-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.backend.profile | quote }}
            - name: DB_URL
              value: {{ .Values.backend.database.url | quote }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: taskmanager-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskmanager-db-secret
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskmanager-backend-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              value: {{ .Values.jwt.expiration | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.cors.allowedOrigins | quote }}
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: taskmanager-backend
spec:
  type: ClusterIP
  selector:
    app: taskmanager-backend
  ports:
    - port: 8080
      targetPort: 8080